name: Deploy a AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest

    steps:
      - name: Conectarse a la EC2, recompilar y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Proyecto_Inscripciones
            git pull origin main
            cd inscripciones-service && mvn clean package -DskipTests && cd ..
            cd examenes-service && mvn clean package -DskipTests && cd ..
            cd bff-service && mvn clean package -DskipTests && cd ..
            cd api-gateway && mvn clean package -DskipTests && cd ..
            docker-compose down
            docker-compose up --build -d
            docker-compose ps