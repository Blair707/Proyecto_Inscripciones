# Nombre del claim personalizado que trae el rol (ESTUDIANTE / INSTRUCTOR).
# Confirmado directamente en un ID token real (decodificado en jwt.io) logueado
# como usuario de prueba: el User Flow expone el atributo con el nombre corto
# "extension_Role" en el token, aunque en el directorio (Graph) se almacene
# internamente como "extension_<appId-sin-guiones>_Role".
app.security.role-claim=extension_Role

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:cursos_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:cursos_pass}

app.rabbitmq.exchange=cursos.exchange
app.rabbitmq.cola-calificaciones=cola.calificaciones
app.rabbitmq.routing-key-calificaciones=calificacion.registrada

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health
